name: Daily Card Data Pipeline

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest Scryfall data
        run: python download_scryfall.py

      - name: Process and export csv
        run: python process_cards_to_csv.py

      - name: Commit and push updated exports
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/exports/*.csv
          git commit -m "Daily update: $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
